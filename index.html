<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos Cartão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a32;
    --accent: #c8f135;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --r: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  h1 span { color: var(--accent); }

  .total-geral {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  .total-geral strong {
    display: block;
    font-size: 1.1rem;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
  }

  /* RESUMO */
  .resumo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 24px;
  }

  .card-pessoa {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .card-pessoa.ativo {
    border-color: var(--accent);
  }

  .card-pessoa::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card-pessoa.ativo::before { opacity: 1; }

  .pessoa-nome {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .pessoa-valor {
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }

  .pessoa-qtd {
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* FORMULÁRIO */
  .form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
    margin-bottom: 24px;
  }

  .form-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus { border-color: var(--accent); }

  input[type="number"] { width: 120px; min-width: 120px; }

  select option { background: #1a1a1e; }

  .btn-add {
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: var(--r);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    padding: 10px 20px;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-add:active { transform: scale(0.98); opacity: 0.9; }

  /* LANÇAMENTOS */
  .lancamentos-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .lancamentos-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .filtro-pessoa {
    font-size: 0.65rem;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
  }

  .lista {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item-info { flex: 1; min-width: 0; }

  .item-desc {
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-meta {
    font-size: 0.62rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .item-tag {
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--border);
    color: var(--muted);
    white-space: nowrap;
  }

  .item-valor {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent2);
    white-space: nowrap;
  }

  .btn-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.2s;
  }

  .btn-del:hover { color: #ff4444; }

  .empty {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  /* WHATSAPP */
  .btn-wpp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #25d366;
    color: #fff;
    border: none;
    border-radius: var(--r);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 12px;
    width: 100%;
    margin-top: 20px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-wpp:active { opacity: 0.85; }

  .aviso-expiry {
    font-size: 0.62rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>💳 <span>Cartão</span></h1>
  <div class="total-geral">
    <span>total geral</span>
    <strong id="totalGeral">R$ 0,00</strong>
  </div>
</header>

<!-- RESUMO POR PESSOA -->
<div class="resumo" id="resumo"></div>

<!-- FORMULÁRIO -->
<div class="form-section">
  <div class="form-title">+ novo lançamento</div>
  <div class="form-row">
    <input type="text" id="descricao" placeholder="Descrição do gasto" />
  </div>
  <div class="form-row">
    <input type="number" id="valor" placeholder="R$ 0,00" step="0.01" min="0" />
    <select id="pessoa">
      <option value="">Quem?</option>
      <option>Reizinho</option>
      <option>Bruna</option>
      <option>Eduardo</option>
      <option>Felipe</option>
      <option>Gicélia</option>
    </select>
  </div>
  <button class="btn-add" onclick="adicionar()">ADICIONAR</button>
</div>

<!-- LISTA -->
<div class="lancamentos-header">
  <span class="lancamentos-title">lançamentos</span>
  <button class="filtro-pessoa" id="btnFiltro" onclick="limparFiltro()">todos</button>
</div>

<div class="lista" id="lista">
  <div class="empty">Nenhum lançamento ainda.</div>
</div>

<!-- EXPORTAR -->
<button class="btn-wpp" onclick="exportarWhatsApp()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.047L.786 23.207a.5.5 0 0 0 .619.619l4.195-1.498A11.953 11.953 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.006-1.371l-.36-.214-3.724 1.329 1.353-3.648-.235-.374A9.818 9.818 0 0 1 12 2.182c5.426 0 9.818 4.392 9.818 9.818 0 5.427-4.392 9.818-9.818 9.818z"/></svg>
  Exportar Resumo
</button>
<div class="aviso-expiry">Lançamentos com mais de 2 meses são removidos automaticamente</div>

<script>
const PESSOAS = ['Reizinho','Bruna','Eduardo','Felipe','Gicélia'];
const CORES = {'Reizinho':'#c8f135','Bruna':'#ff6b35','Eduardo':'#35b8ff','Felipe':'#b035ff','Gicélia':'#ff35a8'};
let filtroAtivo = null;

function salvar(dados) {
  localStorage.setItem('gastos_cartao', JSON.stringify(dados));
}

function carregar() {
  const raw = localStorage.getItem('gastos_cartao');
  if (!raw) return [];
  const dados = JSON.parse(raw);
  const limite = Date.now() - (60 * 24 * 60 * 60 * 1000); // 60 dias
  return dados.filter(d => d.ts > limite);
}

function adicionar() {
  const desc = document.getElementById('descricao').value.trim();
  const val = parseFloat(document.getElementById('valor').value);
  const pessoa = document.getElementById('pessoa').value;

  if (!desc) { alert('Informe a descrição.'); return; }
  if (!val || val <= 0) { alert('Informe um valor válido.'); return; }
  if (!pessoa) { alert('Selecione a pessoa.'); return; }

  const dados = carregar();
  dados.unshift({ id: Date.now(), desc, val, pessoa, ts: Date.now() });
  salvar(dados);

  document.getElementById('descricao').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('pessoa').value = '';

  renderizar();
}

function remover(id) {
  const dados = carregar().filter(d => d.id !== id);
  salvar(dados);
  renderizar();
}

function formatVal(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatData(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
}

function setFiltro(pessoa) {
  filtroAtivo = filtroAtivo === pessoa ? null : pessoa;
  renderizar();
}

function limparFiltro() {
  filtroAtivo = null;
  renderizar();
}

function renderizar() {
  const dados = carregar();

  // Totais por pessoa
  const totais = {};
  const qtds = {};
  PESSOAS.forEach(p => { totais[p] = 0; qtds[p] = 0; });
  dados.forEach(d => { totais[d.pessoa] += d.val; qtds[d.pessoa]++; });

  const totalGeral = Object.values(totais).reduce((a,b) => a+b, 0);
  document.getElementById('totalGeral').textContent = formatVal(totalGeral);

  // Resumo
  const resumoEl = document.getElementById('resumo');
  resumoEl.innerHTML = PESSOAS.map(p => `
    <div class="card-pessoa ${filtroAtivo === p ? 'ativo' : ''}" onclick="setFiltro('${p}')" style="border-color: ${filtroAtivo === p ? CORES[p] : ''}">
      <div class="pessoa-nome" style="color:${CORES[p]}">${p}</div>
      <div class="pessoa-valor">${formatVal(totais[p])}</div>
      <div class="pessoa-qtd">${qtds[p]} lançamento${qtds[p] !== 1 ? 's' : ''}</div>
    </div>
  `).join('');

  // Botão filtro
  const btnFiltro = document.getElementById('btnFiltro');
  btnFiltro.textContent = filtroAtivo ? `✕ ${filtroAtivo}` : 'todos';
  btnFiltro.style.color = filtroAtivo ? CORES[filtroAtivo] : 'var(--accent)';

  // Lista
  const listaEl = document.getElementById('lista');
  const filtrados = filtroAtivo ? dados.filter(d => d.pessoa === filtroAtivo) : dados;

  if (filtrados.length === 0) {
    listaEl.innerHTML = '<div class="empty">Nenhum lançamento.</div>';
    return;
  }

  listaEl.innerHTML = filtrados.map(d => `
    <div class="item">
      <div class="item-info">
        <div class="item-desc">${d.desc}</div>
        <div class="item-meta">${formatData(d.ts)} · <span style="color:${CORES[d.pessoa]}">${d.pessoa}</span></div>
      </div>
      <div class="item-valor">${formatVal(d.val)}</div>
      <button class="btn-del" onclick="remover(${d.id})">×</button>
    </div>
  `).join('');
}

function exportarWhatsApp() {
  const dados = carregar();
  const totais = {};
  PESSOAS.forEach(p => totais[p] = 0);
  dados.forEach(d => totais[d.pessoa] += d.val);
  const total = Object.values(totais).reduce((a,b) => a+b, 0);

  const hoje = new Date().toLocaleDateString('pt-BR');
  let msg = `💳 *RESUMO CARTÃO* — ${hoje}\n\n`;
  PESSOAS.forEach(p => {
    if (totais[p] > 0) {
      msg += `👤 *${p}*: ${formatVal(totais[p])}\n`;
    }
  });
  msg += `\n💰 *Total: ${formatVal(total)}*`;

  const encoded = encodeURIComponent(msg);
  window.open(`https://wa.me/?text=${encoded}`, '_blank');
}

// Init
renderizar();
</script>
</body>
</html>
